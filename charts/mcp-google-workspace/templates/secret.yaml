{{- if and .Values.auth.token (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-google-workspace.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-google-workspace.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
data:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.token | b64enc | quote }}
{{- end }}
