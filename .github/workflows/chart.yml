name: Publish Helm Chart

# Repair path for the `chart` job in release.yml.
#
# The chart normally ships from release.yml on the version tag, which is what
# binds its cosign certificate to `refs/tags/vX.Y.Z`. This workflow exists only
# to re-publish the chart after a failed or interrupted chart job, so it must be
# dispatched at the tag:
#
#   gh workflow run chart.yml --ref v0.9.2 -f version=0.9.2
#
# A dispatch at a branch is rejected on purpose: the certificate would then
# attest a branch build rather than the tagged tree. (This also means it cannot
# backfill a tag whose tree predates this file.)
#
# Keep the packaging and signing steps in sync with the `chart` job in
# release.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must match Chart.yaml and the v<version> tag"
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Package and sign chart
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Require the tag ref
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          if [ "$REF" != "refs/tags/v${version}" ]; then
            echo "::error::dispatch this workflow at the tag: gh workflow run chart.yml --ref v${version} -f version=${version} (got ${REF})"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        env:
          HELM_VERSION: v3.16.4
          HELM_SHA256: fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Verify the chart version matches the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          chart_version="$(helm show chart charts/mcp-google-workspace | awk '$1 == "version:" {print $2}')"
          app_version="$(helm show chart charts/mcp-google-workspace | awk '$1 == "appVersion:" {print $2}' | tr -d '"')"
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "::error::Chart.yaml has version=${chart_version} appVersion=${app_version}, expected ${version}"
            exit 1
          fi

      - name: Lint and render
        run: |
          set -euo pipefail
          helm lint charts/mcp-google-workspace \
            --values charts/mcp-google-workspace/ci/plain-values.yaml
          helm template mcp-google-workspace charts/mcp-google-workspace \
            --namespace mcp-google-workspace \
            --values charts/mcp-google-workspace/ci/plain-values.yaml > /dev/null

      - name: Package and checksum
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist
          helm package charts/mcp-google-workspace --destination dist
          test -f "dist/mcp-google-workspace-${version}.tgz"
          (cd dist && sha256sum "mcp-google-workspace-${version}.tgz" > SHA256SUMS.chart && cat SHA256SUMS.chart)

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: 'v2.5.3'

      - name: Sign chart checksums
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.chart.sig \
            --output-certificate dist/SHA256SUMS.chart.pem \
            dist/SHA256SUMS.chart

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | helm registry login "$REGISTRY" --username "${{ github.actor }}" --password-stdin

      - name: Push the chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          helm push "dist/mcp-google-workspace-${version}.tgz" \
            "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - name: Sign and verify the published chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          ref="${REGISTRY}/${{ github.repository_owner }}/charts/mcp-google-workspace:${version}"
          cosign sign --yes "$ref"
          cosign verify "$ref" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/chart.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "::notice::published ${ref}"

      - name: Attach the chart to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          gh release upload "v${version}" \
            dist/mcp-google-workspace-${version}.tgz \
            dist/SHA256SUMS.chart \
            dist/SHA256SUMS.chart.sig \
            dist/SHA256SUMS.chart.pem \
            --clobber
