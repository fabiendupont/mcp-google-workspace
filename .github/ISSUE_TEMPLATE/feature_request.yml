name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What do you want and why?
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: Related service
      options:
        - Drive
        - Docs
        - Sheets
        - Slides
        - Gmail
        - Calendar
        - Policy engine
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternatives exist today?
