[graph]
targets = []

[advisories]
ignore = [
    # chrono is unmaintained (RUSTSEC-2026-0543). It is pulled in transitively
    # by rmcp/schemars, not used directly by this crate. Tracked upstream in
    # the rmcp project; revisit when rmcp migrates to jiff or time.
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
